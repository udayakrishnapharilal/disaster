# Server Port
server.port=8080

# Application Name
spring.application.name=Disaster Management System

# Default active profile (change to 'mysql' to switch to MySQL database)
# spring.profiles.active=mysql

# H2 Database Configuration (Default for instant running and testing)
spring.datasource.url=jdbc:h2:mem:disaster_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Security Configuration
dms.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
dms.app.jwtExpirationMs=86400000

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# Logging
logging.level.com.dms=INFO
logging.level.org.springframework.security=WARN
